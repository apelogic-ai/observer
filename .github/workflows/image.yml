name: Image

# PRs build and scan without registry access. Immutable v* releases assume the
# infrastructure-provided image publisher role and publish only to the ECR
# coordinates configured as repository variables.

on:
  pull_request:
    paths:
      - "packages/api/**"
      - "package.json"
      - "bun.lock"
      - "deploy/eks/tests/**"
      - ".github/workflows/image.yml"
      - ".github/workflows/chart.yml"
  push:
    tags:
      - "v[0-9]*"
      - "v-recover-*"

concurrency:
  group: observer-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan:
    name: Build & scan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (EKS architecture, local only)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: observer-ingestor:pr

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: observer-ingestor:pr
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: observer-ingestor:pr
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-pr-evidence
          path: sbom.cdx.json
          retention-days: 14

  publish:
    name: Publish immutable ECR image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.OBSERVER_IMAGE_ECR_REPOSITORY }}
      AWS_ROLE_ARN: ${{ vars.OBSERVER_IMAGE_PUBLISH_ROLE_ARN }}
      IMAGE: ${{ format('{0}/{1}', vars.ECR_REGISTRY, vars.OBSERVER_IMAGE_ECR_REPOSITORY) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: "v2.6.2"

      - name: Validate release inputs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REGISTRY ECR_REPOSITORY AWS_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository variable for $name is empty"
              exit 1
            fi
          done
          if [[ "$REF_NAME" == v-recover-* ]]; then
            RECOVERY_TARGET="${REF_NAME#v-recover-}"
            VERSION="${RECOVERY_TARGET%%+*}"
            if [[ "$RECOVERY_TARGET" == *+* ]]; then
              RECOVERY_LABEL="${RECOVERY_TARGET#*+}"
              if [[ ! "$RECOVERY_LABEL" =~ ^[0-9A-Za-z.-]+$ ]]; then
                echo "::error::Recovery tag suffix must contain only letters, digits, dots, or hyphens"
                exit 1
              fi
            fi
            RECOVERY="true"
            RELEASE_REF="refs/tags/v$VERSION"
          else
            VERSION="${REF_NAME#v}"
            RECOVERY="false"
            RELEASE_REF="$GITHUB_REF"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be v<semver> or v-recover-<semver>; got $REF_NAME"
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_REF")
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve released source ref $RELEASE_REF"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RECOVERY=$RECOVERY" >> "$GITHUB_ENV"
          echo "RELEASE_REF=$RELEASE_REF" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          if [ "$RECOVERY" = "true" ]; then
            git checkout --detach "$RELEASE_COMMIT"
          fi

      - name: Assume image publisher role
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: observer-image-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Verify configured ECR target
        id: target
        env:
          LOGIN_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if [ "$LOGIN_REGISTRY" != "$ECR_REGISTRY" ]; then
            echo "::error::Configured ECR registry does not match the assumed role's registry"
            exit 1
          fi
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
          if [ "$RECOVERY" = "true" ]; then
            DIGEST=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$VERSION" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Existing image tag $VERSION did not resolve to an immutable digest"
              exit 1
            fi
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$VERSION" >existing-image.json 2>existing-image.err; then
              echo "::error::Image tag $VERSION already exists; refusing to overwrite a release"
              exit 1
            fi
            if ! grep -q 'ImageNotFoundException' existing-image.err; then
              cat existing-image.err >&2
              exit 1
            fi
          fi

      - name: Build and push immutable amd64 image
        if: env.RECOVERY != 'true'
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: false
          sbom: false

      - name: Resolve immutable image subject
        id: subject
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RECOVERY_DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$RECOVERY" = "true" ]; then
            DIGEST="$RECOVERY_DIGEST"
          else
            DIGEST="$BUILD_DIGEST"
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Release image did not resolve to an immutable sha256 digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.subject.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Verify published image digest
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          PUBLISHED_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "$PUBLISHED_DIGEST" = "$IMAGE_DIGEST"

      - name: Generate vulnerability results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.subject.outputs.digest }}
          format: json
          output: vulnerability-results.json
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: false

      - name: Enforce Trivy critical policy
        run: |
          set -euo pipefail
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' vulnerability-results.json)
          if [ "$CRITICAL_COUNT" -ne 0 ]; then
            echo "::error::Trivy found $CRITICAL_COUNT critical vulnerabilities"
            exit 1
          fi

      - name: Package vulnerability attestation
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --slurpfile result vulnerability-results.json \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg event "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg timestamp "$TIMESTAMP" \
            '{
              invocation: {
                parameters: {severity: "CRITICAL", ignoreUnfixed: false},
                uri: $workflow,
                event_id: $event,
                "builder.id": $workflow
              },
              scanner: {
                uri: "https://github.com/aquasecurity/trivy",
                version: "trivy-action-v0.36.0",
                db: {uri: "https://github.com/aquasecurity/trivy-db", version: "workflow-resolved"},
                result: $result[0]
              },
              metadata: {scanStartedOn: $timestamp, scanFinishedOn: $timestamp}
            }' > vulnerability-attestation.json

      - name: Wait for ECR scan and enforce critical policy
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          if ! aws ecr start-image-scan \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$IMAGE_DIGEST" >ecr-scan-start.json 2>ecr-scan-start.err; then
            if ! grep -Eq 'LimitExceededException|ScanAlreadyExistsException|ValidationException' ecr-scan-start.err; then
              cat ecr-scan-start.err >&2
              exit 1
            fi
          fi

          scan_ready=false
          for attempt in $(seq 1 60); do
            if aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$IMAGE_DIGEST" >ecr-scan.json 2>ecr-scan.err; then
              STATUS=$(jq -r '.imageScanStatus.status // "UNKNOWN"' ecr-scan.json)
              case "$STATUS" in
                COMPLETE|ACTIVE)
                  scan_ready=true
                  break
                  ;;
                FAILED|FINDINGS_UNAVAILABLE|SCAN_ELIGIBILITY_EXPIRED|UNSUPPORTED_IMAGE)
                  echo "::error::ECR scan ended with status $STATUS"
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          if [ "$scan_ready" != true ]; then
            cat ecr-scan.err >&2 || true
            echo "::error::ECR scan did not become ready before timeout"
            exit 1
          fi

          BASIC_CRITICAL=$(jq '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' ecr-scan.json)
          ACTIVE_CRITICAL=$(jq '[.imageScanFindings.enhancedFindings[]? | select(.severity == "CRITICAL" and .status == "ACTIVE")] | length' ecr-scan.json)
          if [ "$BASIC_CRITICAL" -ne 0 ] || [ "$ACTIVE_CRITICAL" -ne 0 ]; then
            echo "::error::ECR reports unresolved critical findings"
            exit 1
          fi

      - name: Generate SLSA provenance predicate
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg buildType "https://github.com/Attestations/GitHubActionsWorkflow@v1" \
            --arg source "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$RELEASE_REF" \
            --arg commit "$RELEASE_COMMIT" \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg invocation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            '{
              buildDefinition: {
                buildType: $buildType,
                externalParameters: {source: $source, image: $image, digest: $digest, platform: "linux/amd64"},
                internalParameters: {},
                resolvedDependencies: [{uri: $source, digest: {gitCommit: $commit}}]
              },
              runDetails: {
                builder: {id: $workflow},
                metadata: {invocationId: $invocation}
              }
            }' > provenance.json

      - name: Sign and attest image by digest
        env:
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          SUBJECT="$IMAGE@$IMAGE_DIGEST"
          if [ "$RECOVERY" != "true" ]; then
            cosign sign --new-bundle-format "$SUBJECT"
            cosign attest --new-bundle-format --type cyclonedx --predicate sbom.cdx.json "$SUBJECT"
          fi
          cosign attest --new-bundle-format --type slsaprovenance1 --predicate provenance.json "$SUBJECT"
          cosign attest --new-bundle-format --type vuln --predicate vulnerability-attestation.json "$SUBJECT"

      - name: Verify signature and attestations
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          SUBJECT="$IMAGE@$IMAGE_DIGEST"
          ORIGINAL_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/image.yml@$RELEASE_REF"
          CURRENT_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/image.yml@$GITHUB_REF"
          ISSUER="https://token.actions.githubusercontent.com"
          if [ "$RECOVERY" = "true" ]; then
            cosign verify --certificate-identity "$ORIGINAL_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >signature-verification.json
            cosign verify-attestation --type cyclonedx --certificate-identity "$ORIGINAL_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >sbom-verification.json
          else
            cosign verify --new-bundle-format --certificate-identity "$CURRENT_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >signature-verification.json
            cosign verify-attestation --new-bundle-format --type cyclonedx --certificate-identity "$CURRENT_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >sbom-verification.json
          fi
          cosign verify-attestation --new-bundle-format --type slsaprovenance1 --certificate-identity "$CURRENT_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >provenance-verification.json
          cosign verify-attestation --new-bundle-format --type vuln --certificate-identity "$CURRENT_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >vulnerability-verification.json

      - name: Write image release report
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          {
            echo "# Observer image release $VERSION"
            echo
            echo "- Image: \`$IMAGE@$IMAGE_DIGEST\`"
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- ECR critical findings: \`0\`"
            echo "- Signature: verified"
            echo "- SBOM, provenance, and vulnerability attestations: verified"
          } > release-report.md
          cat release-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observer-image-release-${{ env.VERSION }}
          path: |
            release-report.md
            sbom.cdx.json
            provenance.json
            vulnerability-results.json
            vulnerability-attestation.json
            ecr-scan.json
            signature-verification.json
            sbom-verification.json
            provenance-verification.json
            vulnerability-verification.json
          retention-days: 90
