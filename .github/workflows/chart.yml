name: Chart

# PRs prove the chart's fail-closed and EKS rendering contracts. chart-v* tags
# assume a separate infrastructure-provided role and publish the chart to the
# exact configured ECR repository.

on:
  pull_request:
    paths:
      - "deploy/eks/chart/**"
      - "deploy/eks/tests/**"
      - ".github/workflows/image.yml"
      - ".github/workflows/chart.yml"
  push:
    tags:
      - "chart-v[0-9]*"
      - "chart-v-recover-*"

concurrency:
  group: observer-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint, test & render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.21"
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.17.1

      - name: Release and chart contract tests
        run: bun test deploy/eks/tests/release-contract.test.ts

      - name: Lint required EKS integration path
        run: helm lint deploy/eks/chart -f deploy/eks/chart/ci/test-values.yaml

      - name: Fail-closed guard
        run: |
          if helm template t deploy/eks/chart >/dev/null 2>&1; then
            echo "::error::chart rendered with empty defaults — fail-closed guard regressed"
            exit 1
          fi
          echo "OK: chart refuses to render without required values"

      - name: Render required EKS integration path
        run: helm template t deploy/eks/chart -f deploy/eks/chart/ci/test-values.yaml >/dev/null

  publish:
    name: Publish immutable ECR chart
    if: startsWith(github.ref, 'refs/tags/chart-v')
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.OBSERVER_CHART_ECR_REPOSITORY }}
      AWS_ROLE_ARN: ${{ vars.OBSERVER_CHART_PUBLISH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.17.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: "v2.6.2"

      - name: Validate release inputs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REGISTRY ECR_REPOSITORY AWS_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository variable for $name is empty"
              exit 1
            fi
          done
          if [[ "$REF_NAME" == chart-v-recover-* ]]; then
            VERSION="${REF_NAME#chart-v-recover-}"
            RECOVERY="true"
            RELEASE_REF="refs/tags/chart-v$VERSION"
          else
            VERSION="${REF_NAME#chart-v}"
            RECOVERY="false"
            RELEASE_REF="$GITHUB_REF"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be chart-v<semver> or chart-v-recover-<semver>; got $REF_NAME"
            exit 1
          fi
          if [ "${ECR_REPOSITORY##*/}" != "observer" ] || [ "${ECR_REPOSITORY%/*}" = "$ECR_REPOSITORY" ]; then
            echo "::error::OBSERVER_CHART_ECR_REPOSITORY must be the exact charts/observer-style repository path"
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_REF")
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve released source ref $RELEASE_REF"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RECOVERY=$RECOVERY" >> "$GITHUB_ENV"
          echo "RELEASE_REF=$RELEASE_REF" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "CHART_PUSH_REPOSITORY=${ECR_REPOSITORY%/*}" >> "$GITHUB_ENV"
          if [ "$RECOVERY" = "true" ]; then
            git checkout --detach "$RELEASE_COMMIT"
          fi

      - name: Assume chart publisher role
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: observer-chart-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Verify configured ECR target and Helm login
        id: target
        env:
          LOGIN_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if [ "$LOGIN_REGISTRY" != "$ECR_REGISTRY" ]; then
            echo "::error::Configured ECR registry does not match the assumed role's registry"
            exit 1
          fi
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
          if [ "$RECOVERY" = "true" ]; then
            DIGEST=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$VERSION" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Existing chart version $VERSION did not resolve to an immutable digest"
              exit 1
            fi
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "ref=$ECR_REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          else
            if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$VERSION" >existing-chart.json 2>existing-chart.err; then
              echo "::error::Chart version $VERSION already exists; refusing to overwrite a release"
              exit 1
            fi
            if ! grep -q 'ImageNotFoundException' existing-chart.err; then
              cat existing-chart.err >&2
              exit 1
            fi
          fi
          aws ecr get-login-password --region "$AWS_REGION" | \
            helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Package chart with released appVersion
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package deploy/eks/chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist
          CHART_PACKAGE="dist/observer-$VERSION.tgz"
          test -f "$CHART_PACKAGE"
          test "$(helm show chart "$CHART_PACKAGE" | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')" = "$VERSION"
          echo "CHART_PACKAGE=$CHART_PACKAGE" >> "$GITHUB_ENV"

      - name: Generate chart SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: deploy/eks/chart
          format: cyclonedx-json
          output-file: chart-sbom.cdx.json
          upload-artifact: false

      - name: Generate chart vulnerability results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: deploy/eks/chart
          format: json
          output: chart-vulnerability-results.json
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: false

      - name: Enforce chart critical policy
        run: |
          set -euo pipefail
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' chart-vulnerability-results.json)
          if [ "$CRITICAL_COUNT" -ne 0 ]; then
            echo "::error::Trivy found $CRITICAL_COUNT critical findings in the chart contents"
            exit 1
          fi

      - name: Package chart vulnerability attestation
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --slurpfile result chart-vulnerability-results.json \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg event "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg timestamp "$TIMESTAMP" \
            '{
              invocation: {
                parameters: {severity: "CRITICAL", ignoreUnfixed: false},
                uri: $workflow,
                event_id: $event,
                "builder.id": $workflow
              },
              scanner: {
                uri: "https://github.com/aquasecurity/trivy",
                version: "trivy-action-v0.36.0",
                db: {uri: "https://github.com/aquasecurity/trivy-db", version: "workflow-resolved"},
                result: $result[0]
              },
              metadata: {scanStartedOn: $timestamp, scanFinishedOn: $timestamp}
            }' > chart-vulnerability-attestation.json

      - name: Push exact chart repository
        if: env.RECOVERY != 'true'
        id: push
        run: |
          set -euo pipefail
          OUTPUT=$(helm push "$CHART_PACKAGE" "oci://$ECR_REGISTRY/$CHART_PUSH_REPOSITORY" 2>&1)
          echo "$OUTPUT"
          DIGEST=$(awk '/Digest:/ {print $2}' <<<"$OUTPUT" | tail -1)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::helm push did not return an immutable sha256 digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=$ECR_REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable chart subject
        id: subject
        env:
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
          PUSH_REF: ${{ steps.push.outputs.ref }}
          RECOVERY_DIGEST: ${{ steps.target.outputs.digest }}
          RECOVERY_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          if [ "$RECOVERY" = "true" ]; then
            DIGEST="$RECOVERY_DIGEST"
            REF="$RECOVERY_REF"
          else
            DIGEST="$PUSH_DIGEST"
            REF="$PUSH_REF"
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "$REF" != "$ECR_REGISTRY/$ECR_REPOSITORY" ]; then
            echo "::error::Release chart did not resolve to the configured immutable subject"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Verify published chart digest
        env:
          CHART_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          PUBLISHED_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$VERSION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "$PUBLISHED_DIGEST" = "$CHART_DIGEST"

      - name: Generate SLSA provenance predicate
        env:
          CHART_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg buildType "https://github.com/Attestations/GitHubActionsWorkflow@v1" \
            --arg source "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$RELEASE_REF" \
            --arg commit "$RELEASE_COMMIT" \
            --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg invocation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg version "$VERSION" \
            --arg digest "$CHART_DIGEST" \
            '{
              buildDefinition: {
                buildType: $buildType,
                externalParameters: {source: $source, chartVersion: $version, appVersion: $version, digest: $digest},
                internalParameters: {},
                resolvedDependencies: [{uri: $source, digest: {gitCommit: $commit}}]
              },
              runDetails: {
                builder: {id: $workflow},
                metadata: {invocationId: $invocation}
              }
            }' > chart-provenance.json

      - name: Sign and attest chart by digest
        env:
          COSIGN_YES: "true"
          CHART_DIGEST: ${{ steps.subject.outputs.digest }}
          CHART_REF: ${{ steps.subject.outputs.ref }}
        run: |
          set -euo pipefail
          SUBJECT="$CHART_REF@$CHART_DIGEST"
          if [ "$RECOVERY" != "true" ]; then
            cosign sign "$SUBJECT"
            cosign attest --type cyclonedx --predicate chart-sbom.cdx.json "$SUBJECT"
          fi
          cosign attest --type slsaprovenance1 --predicate chart-provenance.json "$SUBJECT"
          cosign attest --type vuln --predicate chart-vulnerability-attestation.json "$SUBJECT"

      - name: Verify signature and attestations
        env:
          CHART_DIGEST: ${{ steps.subject.outputs.digest }}
          CHART_REF: ${{ steps.subject.outputs.ref }}
        run: |
          set -euo pipefail
          SUBJECT="$CHART_REF@$CHART_DIGEST"
          ORIGINAL_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/chart.yml@$RELEASE_REF"
          CURRENT_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/chart.yml@$GITHUB_REF"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$ORIGINAL_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >chart-signature-verification.json
          cosign verify-attestation --type cyclonedx --certificate-identity "$ORIGINAL_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >chart-sbom-verification.json
          cosign verify-attestation --type slsaprovenance1 --certificate-identity "$CURRENT_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >chart-provenance-verification.json
          cosign verify-attestation --type vuln --certificate-identity "$CURRENT_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$SUBJECT" >chart-vulnerability-verification.json

      - name: Write chart release report
        env:
          CHART_DIGEST: ${{ steps.subject.outputs.digest }}
          CHART_REF: ${{ steps.subject.outputs.ref }}
        run: |
          {
            echo "# Observer chart release $VERSION"
            echo
            echo "- Chart: \`$CHART_REF@$CHART_DIGEST\`"
            echo "- Chart digest: \`$CHART_DIGEST\`"
            echo "- Chart version: \`$VERSION\`"
            echo "- Application version (appVersion): \`$VERSION\`"
            echo "- Signature: verified"
            echo "- SBOM, provenance, and vulnerability attestations: verified"
          } > release-report.md
          cat release-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chart release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observer-chart-release-${{ env.VERSION }}
          path: |
            release-report.md
            dist/observer-${{ env.VERSION }}.tgz
            chart-sbom.cdx.json
            chart-provenance.json
            chart-vulnerability-results.json
            chart-vulnerability-attestation.json
            chart-signature-verification.json
            chart-sbom-verification.json
            chart-provenance-verification.json
            chart-vulnerability-verification.json
          retention-days: 90
