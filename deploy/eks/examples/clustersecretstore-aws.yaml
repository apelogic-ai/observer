# EXAMPLE — a ClusterSecretStore for the External Secrets Operator backed by
# AWS Secrets Manager. Belongs in YOUR private config / platform repo, not
# upstream. The chart's ExternalSecret (externalSecret.enabled=true) references
# a store like this by name. Auth to Secrets Manager should use IRSA on the
# ESO service account — no static keys.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: <cluster-secret-store>
spec:
  provider:
    aws:
      service: SecretsManager
      region: <region>
      auth:
        jwt:
          serviceAccountRef:
            name: <eso-service-account>
            namespace: <eso-namespace>
