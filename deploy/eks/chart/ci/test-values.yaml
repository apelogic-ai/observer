# Environment-neutral values used only by CI to prove the required EKS render
# path. These are intentionally non-deployable placeholders; real coordinates,
# roles, buckets, hostnames, and secret names live outside this repository.
fullnameOverride: observer-ingestor
image:
  repository: registry.invalid/observer-ingestor
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
config:
  storage: s3
  s3Bucket: deployment-provided
  s3Region: deployment-provided
externalSecret:
  enabled: true
  secretStoreRef:
    name: deployment-provided
  remoteKey: deployment-provided
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: deployment-provided
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: deployment-provided
  hosts:
    - host: observer.invalid
      paths:
        - path: /
          pathType: Prefix
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: deployment-provided
  egress:
    allowHttpsCidrs:
      - 10.0.0.0/16
autoscaling:
  enabled: true
