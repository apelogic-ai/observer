{{- if .Values.networkPolicy.enabled -}}
# Default-deny with an explicit egress allowlist. The ingestor should reach
# only DNS and the AWS APIs it needs (S3/STS); everything else is denied.
# Egress allow-listing is a hard requirement for this workload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observer-ingestor.fullname" . }}
  labels:
    {{- include "observer-ingestor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "observer-ingestor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.dnsEnabled }}
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.egress.allowHttpsCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
