{{- if .Values.externalSecret.enabled -}}
# Pulls OBSERVER_API_KEYS from an external store (e.g. AWS Secrets Manager)
# into a Kubernetes Secret named after this release. Requires the External
# Secrets Operator and its CRDs in-cluster. The secret value never enters git.
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "observer-ingestor.fullname" . }}
  labels:
    {{- include "observer-ingestor.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "observer-ingestor.fullname" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secret.key }}
      remoteRef:
        key: {{ required "externalSecret.remoteKey is required when externalSecret.enabled" .Values.externalSecret.remoteKey }}
        {{- with .Values.externalSecret.remoteProperty }}
        property: {{ . }}
        {{- end }}
{{- end }}
